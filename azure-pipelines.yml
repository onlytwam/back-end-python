trigger:
  branches:
    include:
      - feature/Eshwar                  # ✅ Merge → Build + Push + Deploy

pr:
  branches:
    include:
      - feature/Eshwar                  # ✅ PR raised → Build only

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: 'twam-backend'
  containerRegistry: 'twamregistry.azurecr.io'

steps:
  # ✅ Always runs — both on PR and on merge
  - task: Docker@2
    displayName: Build only (PR validation)
    condition: eq(variables['Build.Reason'], 'PullRequest')
    inputs:
      command: build             # ❌ No push on PR
      repository: $(imageRepository)
      dockerfile: $(Build.SourcesDirectory)/Dockerfile
      containerRegistry: twamregistry
      tags: |
        latest
        $(Build.BuildId)
      arguments: '--no-cache'

  # ✅ Only runs on actual merge to develop
  - task: Docker@2
    displayName: Build and Push to ACR (merge only)
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    inputs:
      command: buildAndPush      # ✅ Push to ACR only after merge
      repository: $(imageRepository)
      dockerfile: $(Build.SourcesDirectory)/Dockerfile
      containerRegistry: twamregistry
      tags: |
        latest
        $(Build.BuildId)
      arguments: '--no-cache'

  # ✅ Deploy only after successful push to ACR on merge
  - task: AzureCLI@2
    displayName: Deploy to Container Apps
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    inputs:
      azureSubscription: twam-azure-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az containerapp update \
          --name twam-backend \
          --resource-group twam-production \
          --image twamregistry.azurecr.io/twam-backend:$(Build.BuildId) \
          --revision-suffix build$(Build.BuildId)