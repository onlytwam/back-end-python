trigger:
  branches:
    include:
      - backend/v2/Mamatha    # ✅ Build only on every push

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: 'twam-backend'
  containerRegistry: 'twamregistry.azurecr.io'

steps:
  - task: Docker@2
    displayName: Build only (no push)
    inputs:
      command: build              # ✅ build only, not buildAndPush
      repository: $(imageRepository)
      dockerfile: $(Build.SourcesDirectory)/Dockerfile
      containerRegistry: twamregistry
      tags: |
        latest
        $(Build.BuildId)
      arguments: '--no-cache'

  # ❌ No push to ACR
  # ❌ No deploy